<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Felix Palingan | Full Stack Netrunner & Creative Developer</title>
    <meta name="description" content="Cyberpunk 2077 inspired interactive 3D portfolio of Felix Palingan, featuring V's Megabuilding H10 apartment, Netrunner workstation, and projects." />
    <meta name="keywords" content="Felix Palingan, Portfolio, Full Stack Developer, Three.js, WebGL, Cyberpunk 2077, Netrunner, JavaScript, Creative Developer" />
    <meta name="author" content="Felix Palingan" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Felix Palingan | Cyberpunk 3D Portfolio" />
    <meta property="og:description" content="Explore V's Megabuilding H10 apartment in real-time 3D WebGL. Discover projects, technical stats, and contact terminal." />
    <meta property="og:url" content="https://felixpalingan.vercel.app/" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,300;0,400;0,600;0,700;1,400&family=JetBrains+Mono:wght@300;400;600;700&family=Orbitron:wght@400;600;700;900&display=swap" rel="stylesheet" />
  </head>
  <body>
    <!-- 3D WebGL Canvas Layer -->
    <canvas id="webgl-canvas"></canvas>

    <!-- Main Application UI / HUD Layer -->
    <div id="app">
      <!-- Cyberpunk HUD Header -->
      <header id="hud-header">
        <div class="hud-brand">
          <span class="hud-tag">[FP]</span>
          <span class="hud-title">FELIX PALINGAN</span>
          <span class="hud-subtitle">// FULL STACK NETRUNNER</span>
        </div>
        <div id="hud-status-pill" class="hud-pill">
          <span class="pulse-dot"></span>
          <span id="current-location-text">MEGABUILDING H10 // ROOM 1214</span>
        </div>
      </header>

      <!-- HUD Navigation Bar (Controls Camera Anchors) -->
      <nav id="hud-nav" aria-label="Apartment Camera Navigation">
        <button class="hud-nav-btn active" data-nav="HOME" id="nav-btn-home">
          <span class="btn-index">01</span>
          <span class="btn-text">HOME</span>
        </button>
        <button class="hud-nav-btn" data-nav="PROJECTS" id="nav-btn-projects">
          <span class="btn-index">02</span>
          <span class="btn-text">PROJECTS</span>
        </button>
        <button class="hud-nav-btn" data-nav="STATS" id="nav-btn-stats">
          <span class="btn-index">03</span>
          <span class="btn-text">STATS</span>
        </button>
        <button class="hud-nav-btn" data-nav="CONTACT" id="nav-btn-contact">
          <span class="btn-index">04</span>
          <span class="btn-text">COMM</span>
        </button>
        <button class="hud-nav-btn" data-nav="TOPDOWN" id="nav-btn-topdown">
          <span class="btn-index">05</span>
          <span class="btn-text">TOP-DOWN</span>
        </button>
      </nav>

      <!-- CRT Scanline Screen Overlay -->
      <div class="hud-scanlines" aria-hidden="true"></div>

      <!-- Cyberpunk HUD Toast for 3D in-world interactions -->
      <div id="copy-toast" class="cyber-toast" aria-live="polite"></div>

      <!-- Loading Screen -->
      <div id="loading-screen">
        <div class="loader-content">
          <div class="glitch-title" data-text="SYSTEM INITIALIZATION">SYSTEM INITIALIZATION</div>
          <div class="loader-subtitle">NEURAL LINK // MEGABUILDING H10 APARTMENT</div>
          <div class="progress-bar-container">
            <div id="progress-bar" class="progress-bar"></div>
          </div>
          <div id="loading-status" class="loading-status">CALIBRATING OPTICS [0%]</div>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
